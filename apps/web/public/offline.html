<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#7f1d1d" />
    <title>PF1e Builder — Offline</title>
    <style>
      body {
        align-items: center;
        background: #f4f0e7;
        color: #231f18;
        display: grid;
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 1.5rem;
      }
      main {
        background: #fffdf8;
        border: 1px solid #d8cdbc;
        border-radius: 1rem;
        margin: auto;
        max-width: 34rem;
        padding: 2rem;
      }
      h1 {
        color: #7f1d1d;
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Reconnect once to load the character builder. Characters already saved
        on this device remain in local storage.
      </p>
    </main>
  </body>
</html>
