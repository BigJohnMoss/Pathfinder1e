name: Validate PF1e data
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check
        run: npm run check > check.log 2>&1
      - name: Upload Infernal Undead failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: infernal-undead-failure
          path: check.log
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
