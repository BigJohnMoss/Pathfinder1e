name: Validate PF1e data
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate pinned spell school map
        run: node tools/scripts/import-spell-schools.mjs > import.log 2>&1
      - name: Upload spell school import failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: section-aware-spell-school-import-failure
          path: import.log
      - run: npm run check
      - run: npm run build
