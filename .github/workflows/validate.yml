name: Validate PF1e data
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check
        run: npm run check > check.log 2>&1
      - name: Upload check failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-failure-${{ github.run_id }}
          path: check.log
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
