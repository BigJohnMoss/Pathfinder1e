name: Validate PF1e data
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build
        run: npm run build > build.log 2>&1
      - name: Upload Sorcerer build failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sorcerer-build-failure
          path: build.log
